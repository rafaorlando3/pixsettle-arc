name: Verify Arc ledger
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: arc-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Contract and receipt tests
        run: npm test
      - name: Verify freshly compiled creation bytecode
        run: >-
          node -e "const c=require('node:crypto'),a=require('./artifacts/contracts/PixSettleLedger.sol/PixSettleLedger.json');const h=c.createHash('sha256').update(Buffer.from(a.bytecode.slice(2),'hex')).digest('hex');if(h!=='a0b44429e3ddee673fd67b22c88af6556fcfd3a261e5c8d03b1976cd459dd5b0')throw Error('Artifact differs from independently checked deployment');console.log('Compiled artifact matches checked deployment');"
      - name: Install browser-test dependency
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Resume, reconciliation and dashboard regression tests
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat node --hostname 127.0.0.1 >/dev/null 2>&1 &
          node_pid=$!
          trap 'kill "$node_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | python -c 'import json,sys;assert int(json.load(sys.stdin)["result"],16)==31337'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          bash test/demo-resume.sh
          bash test/demo-reconcile.sh
          npx hardhat run scripts/demo-flow.cjs --network localhost > /tmp/arc-flow.txt
          python -c 'import json; s=open("/tmp/arc-flow.txt").read(); json.dump(json.loads(s[s.index("{"):]),open("/tmp/flow-parsed.json","w"))'
          python test/panel-browser-check.py
